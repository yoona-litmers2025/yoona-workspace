interface:
  display_name: "Create SRS"
  short_description: "Creating the initial Korean SRS or functional specification draft from multiple project sources."
  default_prompt: "Use $create-srs --client <name> --project <name> [텍스트 또는 Notion 링크]"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "notion-cigro"
      description: "Cigro Notion workspace for PM documents, communication, tasks, and action items"
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
