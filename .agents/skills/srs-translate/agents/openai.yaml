interface:
  display_name: "SRS Translate"
  short_description: "Translating and restructuring a Korean SRS into concise English requirements for developers and designers."
  default_prompt: "Use $srs-translate --client <name> [Notion 링크 또는 텍스트]"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "notion-cigro"
      description: "Cigro Notion workspace for PM documents, communication, tasks, and action items"
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
