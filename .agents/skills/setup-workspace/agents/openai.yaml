interface:
  display_name: "Setup Workspace"
  short_description: "Initializing a PM workspace, creating the five required Notion databases, and configuring the local workspace IDs."
  default_prompt: "Use $setup-workspace --name <PM이름>"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "notion-cigro"
      description: "Cigro Notion workspace for PM documents, communication, tasks, and action items"
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
