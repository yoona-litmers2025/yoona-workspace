interface:
  display_name: "Today Brief"
  short_description: "Preparing the PM's daily brief from current action items, project activity, and calendar context."
  default_prompt: "Use $today-brief"
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "notion-cigro"
      description: "Cigro Notion workspace for PM documents, communication, tasks, and action items"
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"
    - type: "mcp"
      value: "google-workspace"
      description: "Google Workspace calendar and document operations"
